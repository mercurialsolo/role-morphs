name: Refresh postings

# The point of the repository is that the counts age in public. This runs
# weekly, commits the new snapshot, and leaves the history as the record.
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-postings
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install
        run: uv sync --extra dev

      - name: Check the data before touching it
        run: uv run pytest -q

      - name: Fetch boards
        run: uv run python -m pipeline.fetch

      - name: Recount matches
        run: uv run python -m pipeline.match

      - name: Check the data after
        run: uv run pytest -q

      - name: Commit the snapshot
        run: |
          if git diff --quiet -- data/; then
            echo "No change in data/, nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Refresh postings snapshot ($(date -u +%Y-%m-%d))"
          git push
