[project]
name = "role-morphs"
version = "0.1.0"
description = "Which roles are changing shape, what the evidence is, and where to check it yourself."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "jsonschema>=4.21",
]

[project.urls]
Homepage = "https://github.com/mercurialsolo/role-morphs"
Source = "https://github.com/mercurialsolo/role-morphs"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
