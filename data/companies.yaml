# Companies whose job boards the pipeline reads.
#
# Every entry here is a public, unauthenticated JSON endpoint published by an
# applicant tracking system for the purpose of syndicating open roles. We read
# the structured fields and the posting URL. We do not store posting bodies:
# that text belongs to the employer, and this repository is public.
#
# Each slug below was verified to return HTTP 200 on 2026-09-26. To add one,
# find the company's board and check which ATS serves it:
#
#   greenhouse  https://boards-api.greenhouse.io/v1/boards/<slug>/jobs
#   ashby       https://api.ashbyhq.com/posting-api/job-board/<slug>
#   lever       https://api.lever.co/v0/postings/<slug>
#
# `segment` is used for reporting, not for fetching.

companies:
  # Frontier labs
  - name: Anthropic
    ats: greenhouse
    slug: anthropic
    segment: lab
  - name: OpenAI
    ats: ashby
    slug: openai
    segment: lab

  # AI product companies
  - name: Cursor
    ats: ashby
    slug: cursor
    segment: ai_product
