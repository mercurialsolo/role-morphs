  # Data and evaluation suppliers: the industry that sells labs their training
  # environments and expert data. The taxonomy's QA and training-data rows
  # depend on this segment existing.
  - name: Mercor
    ats: ashby
    slug: mercor
    segment: data_supplier
  - name: Scale AI
    ats: greenhouse
    slug: scaleai
    segment: data_supplier

  # Non-AI-native companies. The essay's claim is that AI-shaped roles appear
